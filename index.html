<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Stock Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
/* Layout: one sticky tab bar over a working list. Summary strip first, detail below.
   Look: market-green sign board, high contrast, big tap targets, ₹ and kg/pcs units everywhere. */
:root{
  --bg:#F2F6F3; --surface:#FFFFFF; --surface2:#E6EEE9; --ink:#12201A; --muted:#4D5E56; --line:#C9D6CE;
  --accent:#0A7A4A; --accent-ink:#FFFFFF;
  --warn:#8F5200; --warn-bg:#FFEFC6; --bad:#B3261E; --bad-bg:#FDE2DF; --good:#0A6B42; --good-bg:#D9F2E4;
  --tob:#6B2D5C; --tob-bg:#F3E1EE;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1512; --surface:#16211C; --surface2:#1F2E27; --ink:#EAF3EE; --muted:#A3B6AC; --line:#2D4036;
    --accent:#3FD08A; --accent-ink:#06261A;
    --warn:#F2B04A; --warn-bg:#3A2B0C; --bad:#FF8F86; --bad-bg:#40181A; --good:#52D899; --good-bg:#12392A;
    --tob:#E7A9D8; --tob-bg:#3A1E34;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#16211C; --surface2:#1F2E27; --ink:#EAF3EE; --muted:#A3B6AC; --line:#2D4036;
  --accent:#3FD08A; --accent-ink:#06261A;
  --warn:#F2B04A; --warn-bg:#3A2B0C; --bad:#FF8F86; --bad-bg:#40181A; --good:#52D899; --good-bg:#12392A;
  --tob:#E7A9D8; --tob-bg:#3A1E34;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,p{margin:0}
button{font-family:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* hero */
.hero{background:var(--surface)}
.hero .wrap{padding-block:18px 14px;display:grid;gap:12px}
.hero-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.shopname{font:700 26px/1.2 var(--font-head);color:var(--ink);background:transparent;border:1.5px solid transparent;border-radius:8px;padding:2px 6px;margin-left:-6px;min-height:0;width:min(100%,520px)}
.shopname:hover{border-color:var(--line)}
.dateline{font:600 17px var(--font-body);color:var(--muted)}
.save{font:600 13px var(--font-body);padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.save[data-s="db"]{background:var(--good-bg);color:var(--good)}
.save[data-s="error"]{background:var(--bad-bg);color:var(--bad)}
.save[data-s="pending"],.save[data-s="slow"]{background:var(--warn-bg);color:var(--warn)}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
@media(min-width:720px){.sum{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sum div{background:var(--surface2);border-radius:10px;padding:10px 14px}
.sum dt{font:600 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sum dd{margin:2px 0 0;font:700 24px/1.2 var(--font-head);font-variant-numeric:tabular-nums}
.sum dd small{font:500 13px var(--font-body);color:var(--muted);display:block}
.sum .bad dd{color:var(--bad)}
.banner{border-radius:10px;padding:12px 14px;background:var(--good-bg);color:var(--ink);border:1.5px solid var(--accent);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{font-weight:700}
.banner.quiet{background:var(--surface2);border-color:var(--line)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:52px;padding:0 16px;background:none;border:0;border-bottom:4px solid transparent;color:var(--muted);font:600 16px var(--font-body);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab.tobacco[aria-current="page"]{border-bottom-color:var(--tob)}
.badge{min-width:24px;height:24px;border-radius:12px;padding:0 7px;background:var(--bad);color:#fff;font:700 13px/24px var(--font-body);text-align:center;font-variant-numeric:tabular-nums}
.badge:empty{display:none}

main{padding-block:16px 96px}

/* controls */
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;width:100%;min-width:0}
textarea{padding:10px 12px;line-height:1.5;resize:vertical}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--font-body);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.tob{background:var(--tob);border-color:var(--tob);color:var(--surface)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{flex:1 1 220px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--font-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.need[aria-pressed="true"]{background:var(--warn);color:var(--surface);border-color:var(--warn)}
.sample{margin-bottom:12px}
.tobnote{background:var(--tob-bg);border:1.5px solid var(--tob);color:var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.tobnote b{color:var(--tob)}

/* stock rows */
.cat{font:700 14px var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;gap:10px;align-items:baseline}
.cat span{font:500 13px var(--font-body);letter-spacing:0;text-transform:none}
.row{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr);margin-bottom:10px}
.row.low{border-left-color:var(--warn)}
.row.out{border-left-color:var(--bad)}
.row.ok{border-left-color:var(--accent)}
.row > div{min-width:0}
@media(min-width:640px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.row{grid-template-columns:minmax(170px,1.5fr) minmax(170px,1.1fr) minmax(190px,1.2fr) minmax(190px,1.3fr) minmax(110px,.9fr) auto;align-items:center}}
.row h3{font:700 18px/1.3 var(--font-head)}
.meta{font-size:14px;color:var(--muted)}
.k{font:600 12px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block}
.c-rate{display:flex;gap:18px}
.c-rate b{font:700 18px var(--font-body);font-variant-numeric:tabular-nums}
.lowm{color:var(--warn)}
.step{display:flex;gap:6px;align-items:center;margin:4px 0}
.step button{flex:0 0 46px;height:46px;border-radius:10px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font:700 24px/1 var(--font-body);cursor:pointer}
.step button:active{background:var(--surface2)}
.step input{flex:1 1 70px;max-width:110px;height:46px;text-align:center;font:700 20px var(--font-body);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font:700 13px var(--font-body)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.low{background:var(--warn-bg);color:var(--warn)}
.pill.out{background:var(--bad-bg);color:var(--bad)}
.pill.tob{background:var(--tob-bg);color:var(--tob)}
.pill.info,.pill.new{background:var(--surface2);color:var(--ink)}
.row.new{border-left-color:var(--line)}
.ord{margin-top:6px;font-size:16px}
.ord.wait{color:var(--muted)}
.exp{font:600 13px var(--font-body);margin-top:2px}
.exp.bad{color:var(--bad)}
.exp.warn{color:var(--warn)}
.warnTxt{color:var(--warn);font-weight:600}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 18px var(--font-head);margin-bottom:4px}

/* cards, tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font:700 20px/1.3 var(--font-head)}
.card-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tablewrap{overflow-x:auto;margin:6px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 12px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th.n,td.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0;font-size:17px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.dchip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 60%,var(--surface));font:600 13px var(--font-body);color:var(--ink)}
.dchip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.dayc{padding:3px 10px;border-radius:8px;background:var(--surface2);font:600 13px var(--font-body);color:var(--muted)}
.dayc.on{background:var(--accent);color:var(--accent-ink)}
.sel-text{user-select:all}

/* calendar */
.week{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px}
.wd{flex:0 0 156px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;align-content:start;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.wd.today{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.wd b{font:700 16px var(--font-head)}
.wd .dchip{justify-self:start}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.calnav h2{font:700 20px var(--font-head)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font:700 12px var(--font-body);color:var(--muted);text-align:center;padding:6px 0;text-transform:uppercase;letter-spacing:.06em}
.day{min-height:58px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink);font:600 16px var(--font-body);position:relative;cursor:pointer}
.day.blank{border:0;background:none;cursor:default}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel{background:var(--surface2);border-color:var(--ink);border-width:2px}
.day.has-note::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:2px;background:var(--warn)}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px var(--surface)}
.dl{display:grid;gap:10px}
.dl > div{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}

/* tips */
.tip{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.tip h3{font:700 17px/1.35 var(--font-head);margin-bottom:4px}
.tip p{color:var(--ink)}
.tip.bad{border-left-color:var(--bad)}
.tip.warn{border-left-color:var(--warn)}
.tip.good{border-left-color:var(--accent)}
.tip.info{border-left-color:var(--muted)}
.tip.tob{border-left-color:var(--tob)}
.tips{display:grid;gap:10px}
.sec{font:700 14px var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}

/* overlay */
.ov{position:fixed;inset:0;z-index:40;background:rgba(8,16,12,.6);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:680px;max-height:100%;overflow:auto;border-radius:16px 16px 0 0;padding-top:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:700px){.ov{align-items:center;padding:24px}.sheet{border-radius:16px;max-height:92%}}
.sheet h2{font:700 22px var(--font-head);margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font:600 14px var(--font-body);margin-bottom:4px}
.fld small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.ferr{color:var(--bad);font-weight:600;min-height:22px;margin-top:8px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;cursor:pointer}
.checks input{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.qrow{display:flex;gap:8px}
.qrow input{flex:1 1 90px}
.qrow select{flex:0 1 190px}
.conv{color:var(--accent);font-weight:700;font-size:15px;min-height:20px}
.autoq{background:var(--surface2);border-radius:10px;padding:10px 12px;font-weight:600}
.rbtns{display:flex;gap:8px;flex-wrap:wrap}
@media(min-width:1000px){.rbtns{flex-direction:column}}
.nrow{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr);margin-bottom:8px}
.nrow > div{min-width:0}
.nrow.done{border-left-color:var(--accent)}
@media(min-width:720px){.nrow{grid-template-columns:minmax(160px,1.2fr) minmax(260px,1.2fr) minmax(180px,1fr);align-items:center}}
.nsold{font-size:15px}
details summary{cursor:pointer;min-height:32px}
.card ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.sum .good dd{color:var(--good)}
.calcout{font:700 28px/1.3 var(--font-head);min-height:40px;margin:8px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.key{min-height:54px;font:700 20px var(--font-body);border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.key.op{background:var(--surface2)}
.key.eq{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.key:active{filter:brightness(.92)}
.res{background:var(--surface2);border-radius:10px;padding:12px;margin-top:12px;display:grid;gap:4px}
.qw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qw input{flex:0 0 84px;width:84px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.qw select{flex:1 1 150px;width:auto;min-width:0}
.qw .plus{font:700 20px var(--font-body);color:var(--muted)}
.qw .lbl{color:var(--muted);font-size:14px}
.subh{font:700 16px var(--font-head);margin:6px 0 2px}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;margin:0 auto;max-width:460px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:600;text-align:center}
</style>

</head>
<body>
<header class="hero" id="hero">
  <div class="wrap">
    <div class="hero-top">
      <div>
        <input id="shopName" class="shopname" type="text" aria-label="Shop name" value="My Shop" maxlength="60">
        <p class="dateline" id="dateLine"></p>
      </div>
      <span class="save" id="saveState" data-s="local" role="status">Starting</span>
    </div>
    <dl class="sum" id="summary"></dl>
    <div id="todayBanner"></div>
  </div>
</header>

<div class="tabs" id="tabs">
  <div class="wrap">
    <nav aria-label="Sections">
      <button class="tab" type="button" data-tab="stock">Stock</button>
      <button class="tab tobacco" type="button" data-tab="tobacco">Tobacco</button>
      <button class="tab" type="button" data-tab="night">Night count</button>
      <button class="tab" type="button" data-tab="orders">Order list <span class="badge" id="ordBadge"></span></button>
      <button class="tab" type="button" data-tab="dealers">Wholesalers</button>
      <button class="tab" type="button" data-tab="calendar">Calendar</button>
      <button class="tab" type="button" data-tab="report">Report</button>
      <button class="tab" type="button" data-tab="month">Month report</button>
      <button class="tab" type="button" data-tab="calc">Calculator</button>
      <button class="tab" type="button" data-tab="units">Unit converter</button>
      <button class="tab" type="button" data-tab="ideas">Suggestions</button>
    </nav>
  </div>
</div>

<main class="wrap" id="view"></main>

<div class="ov" id="ov" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DAYF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
var MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DORDER=[1,2,3,4,5,6,0];
var PAL=['#0A9B6A','#2F6FDE','#D9822B','#B5388F','#7A5AF0','#C4443B','#0E8FA8','#8A8F1F'];
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var today=function(){return ymd(new Date())};
var shortD=function(s){var d=parse(s);return d.getDate()+' '+MONS[d.getMonth()]};
var longD=function(s){var d=parse(s);return DAYF[d.getDay()]+', '+d.getDate()+' '+MONF[d.getMonth()]+' '+d.getFullYear()};
var num=function(v){var n=parseFloat(v);return isFinite(n)?n:0};
var q2=function(n){return String(Math.round(n*100)/100)};
var rt=function(v){return num(v)>0?money(num(v)):'Not set'};
var money=function(n){return '₹'+(Math.round(n*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2})};

function upgrade(){ if(S&&S.sample&&(S.v||1)<2){S=starter();return true;} return false; }

function normalize(){
  if(!S||typeof S!=='object') S=starter();
  if(!Array.isArray(S.items)) S.items=[];
  if(!Array.isArray(S.dealers)) S.dealers=[];
  if(!S.remind||typeof S.remind!=='object') S.remind={};
  if(typeof S.notes!=='string') S.notes='';
  if(typeof S.shop!=='string'||!S.shop) S.shop='My Shop';
  var ids={}; S.dealers.forEach(function(d){ids[d.id]=1; if(!Array.isArray(d.days)) d.days=[]; if(d.lead==null) d.lead=1; if(d.address==null) d.address='';});
  S.items.forEach(function(i){
    if(!ids[i.dealer]) i.dealer='';
    if(i.ovr==null) i.ovr='';
    if(i.packSize==null) i.packSize='';
    if(i.packName==null) i.packName='';
    if(i.boxSize==null) i.boxSize='';
    if(i.boxName==null) i.boxName='';
    if(i.ordUnit==null) i.ordUnit='';
    if(i.orderedOn==null) i.orderedOn='';
    if(i.ordQty==null) i.ordQty=0;
    if(!i.cat) i.cat='Other';
    if(!i.unit) i.unit='pcs';
  });
  if(!H||typeof H.snaps!=='object'||!H.snaps) H={snaps:{}};
  if(!Array.isArray(H.recv)) H.recv=[];
  if(!H.months||typeof H.months!=='object') H.months={};
  if(!S.exp||typeof S.exp!=='object') S.exp={};
  if(typeof S.lastBackup!=='string') S.lastBackup='';
}

/* ---------- derived values ---------- */
var isTob=function(i){return String(i.cat||'').trim().toLowerCase()==='tobacco'};
var dealerOf=function(id){return S.dealers.find(function(d){return d.id===id})};
var dIdx=function(id){return Math.max(0,S.dealers.findIndex(function(d){return d.id===id}))};
var dColor=function(id){return PAL[dIdx(id)%PAL.length]};
function status(i){var q=num(i.qty); if(q<=0&&num(i.min)<=0&&num(i.target)<=0) return 'new'; if(q<=0) return 'out'; if(q<=num(i.min)) return 'low'; return 'ok';}
function orderQty(i){
  if(i.orderedOn) return 0;
  var p=pk(i);
  if(i.ovr!==''&&i.ovr!=null&&isFinite(parseFloat(i.ovr))) return Math.max(0,num(i.ovr));
  if(status(i)==='ok') return 0;
  var need=Math.max(0,num(i.target)-num(i.qty));
  return p?Math.ceil(need/p)*p:need;
}
function unitsFrom(o){
  var list=[];
  var add=function(n,sz,custom){
    n=String(n||'').trim(); sz=num(sz); if(!(sz>1)) return;
    if(list.some(function(x){return x.name.toLowerCase()===n.toLowerCase()})) return;
    list.push({name:n,size:sz,custom:custom});
  };
  add(o.packName||'pack',o.packSize,true);
  add(o.boxName||'box',o.boxSize,true);
  add('dozen',12,false);
  return list;
}
function ordU(o){
  var l=unitsFrom(o), v=String(o.ordUnit||'').toLowerCase();
  if(v==='pcs') return null;
  if(v){var f=l.filter(function(x){return x.name.toLowerCase()===v})[0]; if(f) return f;}
  return l.filter(function(x){return x.custom})[0]||null;
}
function pk(i){var u=ordU(i);return u?u.size:0}
function fmtMix(i,pcs){
  var u=ordU(i), base=i.unit||'pcs';
  if(!u||pcs<u.size-1e-9) return q2(pcs)+' '+base;
  var f=Math.floor(pcs/u.size+1e-9), r=Math.round((pcs-f*u.size)*100)/100;
  return f+' '+u.name+(r?' + '+q2(r)+' '+base:'')+' ('+q2(pcs)+' '+base+')';
}
function joinQty(list,a,name,b){
  var u=list.filter(function(x){return x.name.toLowerCase()===String(name).toLowerCase()})[0];
  return Math.round((num(a)*(u?u.size:1)+num(b))*100)/100;
}
function splitQty(o,pcs){
  var u=ordU(o)||unitsFrom(o)[0]; pcs=num(pcs);
  if(pcs<=0) return {a:'',u:u.name,b:''};
  if(pcs>=u.size-1e-9){var f=Math.floor(pcs/u.size+1e-9), r=Math.round((pcs-f*u.size)*100)/100; return {a:f,u:u.name,b:r||''};}
  return {a:'',u:u.name,b:pcs};
}
function selOpts(list,cur){
  return list.map(function(x){return '<option value="'+esc(x.name)+'"'+(x.name===cur?' selected':'')+'>'+esc(x.name)+' ('+q2(x.size)+')</option>'}).join('');
}
function qwHTML(o,pcs,a,u,b,aria,zero){
  var sp=splitQty(o,pcs), list=unitsFrom(o), base=esc(o.unit||'pcs');
  if(zero&&num(pcs)<=0) sp.b=0;
  return '<div class="qw"><input '+a+' type="number" inputmode="decimal" step="any" min="0" placeholder="0" value="'+esc(sp.a)+'" aria-label="'+esc(aria)+': number of packs"><select '+u+' aria-label="'+esc(aria)+': pack type">'+selOpts(list,sp.u)+'</select><span class="plus">+</span><input '+b+' type="number" inputmode="decimal" step="any" min="0" placeholder="0" value="'+esc(sp.b)+'" aria-label="'+esc(aria)+': loose pieces"><span class="lbl">loose '+base+'</span></div>';
}
function mixText(list,base,a,name,b){
  var pcs=joinQty(list,a,name,b), parts=[];
  if(num(a)>0) parts.push(q2(num(a))+' '+name);
  if(num(b)>0) parts.push(q2(num(b))+' '+base);
  if(!parts.length) return '';
  return parts.join(' + ')+(num(a)>0?' = '+q2(pcs)+' '+base:'');
}
function ordTxt(i,units){return fmtMix(i,units)}
function looseTxt(i){return fmtMix(i,num(i.qty))}

function margin(i){return (num(i.sell)>0&&num(i.buy)>0)?((num(i.sell)-num(i.buy))/num(i.sell)*100):null}
function expiry(i){
  if(!i.exp) return null;
  var days=Math.round((parse(i.exp)-parse(today()))/864e5);
  if(days<0) return {cls:'bad',days:days,text:'Expired '+pl(-days,'day')+' ago'};
  if(days<=30) return {cls:'warn',days:days,text:'Expires in '+pl(days,'day')+' ('+shortD(i.exp)+')'};
  return null;
}
function prevCount(i){
  var t=today();
  var ds=Object.keys(H.snaps).filter(function(d){return d<t&&H.snaps[d]&&H.snaps[d][i.id]!=null}).sort();
  if(!ds.length) return 'No earlier count yet';
  var d=ds[ds.length-1], v=H.snaps[d][i.id], diff=num(i.qty)-v;
  return 'Last count '+q2(v)+' on '+shortD(d)+(diff<0?' (down '+q2(-diff)+')':diff>0?' (up '+q2(diff)+')':' (no change)');
}
function needItems(){return S.items.filter(function(i){return orderQty(i)>0})}
function stockValue(list){return (list||S.items).reduce(function(s,i){return s+num(i.qty)*num(i.buy)},0)}
function dealersOn(ds){var w=parse(ds).getDay();return S.dealers.filter(function(d){return d.days.indexOf(w)>-1})}
function pendingFor(id){
  var l=S.items.filter(function(i){return (i.dealer||'')===id&&orderQty(i)>0});
  return {n:l.length,total:l.reduce(function(s,i){return s+orderQty(i)*num(i.buy)},0)};
}
function nextOrderDay(){
  for(var k=0;k<7;k++){var d=new Date();d.setDate(d.getDate()+k);var s=ymd(d);var ds=dealersOn(s);if(ds.length) return {k:k,s:s,ds:ds};}
  return null;
}
function relDay(k,s){return k===0?'Today':k===1?'Tomorrow':DAYF[parse(s).getDay()]+' '+shortD(s)}

/* ---------- saving ---------- */
var mainRef=null,histRef=null,dirty=false,hdirty=false,saving=false,timer=null,saveErr=false;
var SAVE_TXT={local:'Saved on this device',db:'Saved',pending:'Saving...',error:'Not saved. Will retry',slow:'Connecting...',start:'Starting'};
function setSave(s){var e=$('#saveState'); if(!e) return; e.dataset.s=(s==='local'||s==='db'||s==='error'||s==='pending'||s==='slow')?s:'local'; e.textContent=SAVE_TXT[s]||s;}
function pruneHist(){
  var ks=Object.keys(H.snaps).sort();
  while(ks.length>60){delete H.snaps[ks.shift()];}
  var c=new Date(); c.setDate(c.getDate()-90); var cs=ymd(c);
  H.recv=H.recv.filter(function(r){return r.d>=cs}).slice(-400);
  archiveMonths();
  return {snaps:H.snaps,recv:H.recv,months:H.months};
}
function cache(){try{localStorage.setItem(LS,JSON.stringify({S:S,H:H}))}catch(e){}}
function touch(h){
  dirty=true; if(h) hdirty=true;
  cache(); setSave(mainRef?'pending':'local');
  clearTimeout(timer); timer=setTimeout(flush,700);
}
async function flush(){
  if(saving){clearTimeout(timer);timer=setTimeout(flush,400);return;}
  if(!dirty&&!hdirty) return;
  if(!mainRef){dirty=false;hdirty=false;setSave('local');return;}
  saving=true;
  var wd=dirty,wh=hdirty; dirty=false; hdirty=false;
  try{
    if(wd) await mainRef.set(JSON.parse(JSON.stringify(S)));
    if(wh) await histRef.set(JSON.parse(JSON.stringify(pruneHist())));
    saveErr=false; setSave(dirty||hdirty?'pending':'db');
  }catch(e){
    if(wd) dirty=true; if(wh) hdirty=true; saveErr=true; setSave('error');
  }
  saving=false;
  if((dirty||hdirty)&&!saveErr){clearTimeout(timer);timer=setTimeout(flush,700);}
}
function snap(i){
  var t=today(); if(!H.snaps[t]) H.snaps[t]={}; H.snaps[t][i.id]=num(i.qty);
}

/* ---------- stock view ---------- */
function rowHTML(i){
  var st=status(i), oq=orderQty(i), d=dealerOf(i.dealer), m=margin(i), e=expiry(i), u=esc(i.unit);
  var stTxt={ok:'Stock OK',low:'Low stock',out:'Out of stock','new':'Not counted yet'}[st];
  var ordHTML;
  if(i.orderedOn) ordHTML='<p class="ord wait">Ordered '+esc(ordTxt(i,num(i.ordQty)))+' on '+shortD(i.orderedOn)+'. Waiting for delivery.</p>';
  else if(oq>0) ordHTML='<p class="ord">Order <b>'+esc(ordTxt(i,oq))+'</b> &middot; '+money(oq*num(i.buy))+'</p>';
  else ordHTML='<p class="meta">No order needed</p>';
  return '<article class="row '+st+'" data-row="'+i.id+'">'+
    '<div><h3>'+esc(i.name)+'</h3><p class="meta">'+esc(i.cat)+' &middot; per '+u+(pk(i)?' &middot; 1 '+esc(ordU(i).name)+' = '+q2(pk(i))+' '+u+(num(i.buy)>0?' &middot; pack cost '+money(num(i.buy)*pk(i)):''):'')+'</p>'+(e?'<p class="exp '+e.cls+'">'+esc(e.text)+'</p>':'')+(i.note?'<p class="meta">'+esc(i.note)+'</p>':'')+'</div>'+
    '<div class="c-rate"><div><span class="k">Buy rate</span><b>'+rt(i.buy)+'</b></div><div><span class="k">Sell rate</span><b>'+rt(i.sell)+'</b></div><div><span class="k">Margin</span><b class="'+(m!=null&&m<8?'lowm':'')+'">'+(m==null?'-':Math.round(m)+'%')+'</b></div></div>'+
    '<div><label class="k" for="q-'+i.id+'">In stock ('+u+')</label>'+
      '<div class="step"><button type="button" data-act="dec" data-id="'+i.id+'" aria-label="Reduce '+esc(i.name)+' by 1">&minus;</button>'+
      '<input id="q-'+i.id+'" class="qty" data-id="'+i.id+'" type="number" inputmode="decimal" step="any" min="0" value="'+q2(num(i.qty))+'">'+
      '<button type="button" data-act="inc" data-id="'+i.id+'" aria-label="Add 1 to '+esc(i.name)+'">+</button></div>'+
      (pk(i)?'<p class="meta">= '+esc(looseTxt(i))+'</p>':'')+'<p class="meta">'+esc(prevCount(i))+'</p></div>'+
    '<div><span class="pill '+st+'">'+stTxt+'</span>'+ordHTML+'<p class="meta">Reorder at '+esc(fmtMix(i,num(i.min)))+' &middot; fill to '+esc(fmtMix(i,num(i.target)))+'</p></div>'+
    '<div><span class="k">Buy from</span><p>'+(d?esc(d.name):'<span class="warnTxt">No wholesaler chosen</span>')+'</p></div>'+
    '<div class="rbtns"><button class="btn" type="button" data-act="receive" data-id="'+i.id+'">Stock received</button><button class="btn" type="button" data-act="edit" data-id="'+i.id+'">Edit</button></div>'+
  '</article>';
}
function renderStock(tob){

  var cats=Array.from(new Set(list.map(function(i){return i.cat}))).sort();

  if(tob) h+='<div class="tobnote"><b>Tobacco section.</b> Count these every day. Do not sell to anyone under 18, and check the local rules about selling near schools and colleges (COTPA). Some products such as gutkha are banned in Haryana, so confirm what is allowed before you stock it.</div>';
  h+='<div class="toolbar"><input id="search" type="search" placeholder="Search item name" aria-label="Search items" value="'+esc(qStr)+'">'+
     '<button class="btn '+(tob?'tob':'primary')+'" type="button" data-act="add-item">+ Add '+(tob?'tobacco item':'item')+'</button></div>';
  h+='<div class="chips">';

    h+='<button class="chip" type="button" data-act="chip" data-cat="All" aria-pressed="'+(fCat==='All')+'">All ('+list.length+')</button>';
    cats.forEach(function(c){h+='<button class="chip" type="button" data-act="chip" data-cat="'+esc(c)+'" aria-pressed="'+(fCat===c)+'">'+esc(c)+'</button>'});
  }
  h+='<button class="chip need" type="button" data-act="need" aria-pressed="'+fNeed+'">Only items to order</button></div>';
  h+='<div id="list"></div>';
  $('#view').innerHTML=h;
  renderList();
}
function renderList(){
  var list=S.items.filter(function(i){return isTob(i)===curTob});
  if(!curTob&&fCat!=='All') list=list.filter(function(i){return i.cat===fCat});
  if(fNeed) list=list.filter(function(i){return orderQty(i)>0});
  if(qStr.trim()){var s=qStr.trim().toLowerCase();list=list.filter(function(i){return (i.name+' '+i.cat).toLowerCase().indexOf(s)>-1})}
  list.sort(function(a,b){return a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name,undefined,{numeric:true})});
  var el=$('#list'); if(!el) return;
  if(!list.length){
    el.innerHTML='<div class="empty"><b>'+(S.items.length?'No items match':'No items yet')+'</b>'+(S.items.length?'Clear the search or the filter.':'Tap Add item to enter your first product.')+'</div>';
    return;
  }
  var h='',last=null;
  list.forEach(function(i){
    if(i.cat!==last){
      last=i.cat;
      var n=list.filter(function(x){return x.cat===last}).length;
      h+='<h2 class="cat">'+esc(last)+' <span>'+pl(n,'item')+'</span></h2>';
    }
    h+=rowHTML(i);
  });
  el.innerHTML=h;

function groups(){
  var ids=S.dealers.map(function(d){return d.id}).concat(['']);
  return ids.map(function(id){
    var its=S.items.filter(function(i){return (i.dealer||'')===id});
    var lines=its.filter(function(i){return orderQty(i)>0}).sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});
    var wait=its.filter(function(i){return i.orderedOn});
    return {id:id,d:dealerOf(id),lines:lines,wait:wait,total:lines.reduce(function(s,i){return s+orderQty(i)*num(i.buy)},0)};
  }).filter(function(g){return g.lines.length||g.wait.length});
}
function orderText(id){

/* ---------- suggestions ---------- */
function advice(){
  var A=[], items=S.items, m=new Date().getMonth();
  var need=needItems(), out=items.filter(function(i){return status(i)==='out'&&!i.orderedOn});
  if(!items.length) return [{tone:'info',t:'Add your items first',p:'Once items, rates and stock numbers are in, this page works out what to order and what to watch.'}];
  if(need.length){
    var tot=need.reduce(function(s,i){return s+orderQty(i)*num(i.buy)},0);
    var gs=groups().filter(function(g){return g.lines.length}).sort(function(a,b){return b.total-a.total});
    A.push({tone:'warn',t:pl(need.length,'item')+' to order, about '+money(tot),p:'The biggest order is '+esc(gs[0].d?gs[0].d.name:'items with no wholesaler')+' at '+money(gs[0].total)+'. Open the Order list tab and send one message per wholesaler.'});
  } else A.push({tone:'good',t:'Nothing is below its reorder level',p:'Keep counting stock each day so this stays true.'});
  if(out.length) A.push({tone:'bad',t:'Out of stock right now',p:esc(names(out))+'. Each day these are out is a day of lost sales, so order them first.'});
  var unc=items.filter(function(i){return status(i)==='new'});
  if(unc.length) A.push({tone:'info',t:pl(unc.length,'item')+' not counted yet',p:'Enter the stock, reorder level and fill-up level for each item. Until then they stay out of the order list.'});
  var nob=items.filter(function(i){return num(i.buy)<=0});
  if(nob.length) A.push({tone:'info',t:pl(nob.length,'item')+' with no buy rate',p:'Margin and order totals need the buy rate. Copy it from your wholesaler bills.'});
  var nx=nextOrderDay();
  if(nx){
    A.push({tone:nx.k===0?'warn':'info',t:nx.k===0?'Today is an order day':'Next order day is '+relDay(nx.k,nx.s),p:'Wholesalers: '+esc(nx.ds.map(function(d){return d.name}).join(', '))+'. Count the shelves in the evening before so the list is ready.'});
  }
  var nod=items.filter(function(i){return !i.dealer});
  if(nod.length) A.push({tone:'warn',t:pl(nod.length,'item')+' with no wholesaler',p:esc(names(nod))+'. Pick a wholesaler for each, or they cannot appear in an order message.'});
  var loss=items.filter(function(i){return num(i.buy)>0&&num(i.sell)>0&&num(i.sell)<=num(i.buy)});
  if(loss.length) A.push({tone:'bad',t:'Selling at or below cost',p:esc(names(loss))+'. Check the sell rate or the buy rate.'});
  var thin=items.filter(function(i){var g=margin(i);return g!=null&&g>0&&g<8});
  if(thin.length) A.push({tone:'warn',t:'Very thin margin (under 8%)',p:esc(names(thin))+'. These need volume to be worth the shelf space. Ask the wholesaler for a better rate or a scheme.'});
  var over=items.filter(function(i){return num(i.target)>0&&num(i.qty)>num(i.target)*1.5});
  if(over.length) A.push({tone:'info',t:'More stock than you need',p:esc(names(over))+'. Skip these in the next order. Money sitting on the shelf is not earning.'});
  var ex=items.filter(function(i){return expiry(i)}).sort(function(a,b){return expiry(a).days-expiry(b).days});
  if(ex.length) A.push({tone:ex.some(function(i){return expiry(i).days<0})?'bad':'warn',t:'Check expiry dates',p:esc(names(ex))+'. Put these at the front and sell first. Ask the wholesaler about return or replacement.'});
  var tobs=items.filter(isTob);
  if(tobs.length) A.push({tone:'tob',t:'Tobacco section',p:'Stock value is '+money(stockValue(tobs))+' across '+pl(tobs.length,'item')+'. Small, costly items go missing first, so count them every evening. Sale to under 18 is not allowed, and there are limits on selling near schools and colleges.'});
  A.push({tone:'info',t:'Money tied up in stock',p:money(stockValue())+' at buy rate. If everything sold at the sell rates you would earn about '+money(items.reduce(function(s,i){return s+num(i.qty)*num(i.sell)},0)-stockValue())+' more than you paid.'});
  var season=(m>=10||m<=1)?'Winter and wedding season (Nov to Feb): tea, coffee, biscuits, rusk, gajak, chikki, peanuts, jaggery, dry fruits and sugar sell faster. Cold drinks slow down, so order smaller lots. Bulk oil, atta and sugar for functions can come in at short notice, so keep a buffer.'
    :(m>=2&&m<=5)?'Summer (Mar to Jun): cold drinks, juice, packaged water and ice cream move fast. Keep the fridge full and order them more often in small lots. Tea and rusk slow down.'
    :(m>=6&&m<=8)?'Monsoon (Jul to Sep): tea, biscuits, namkeen and noodles sell well. Damp spoils atta, sugar and biscuits, so keep them off the floor and do not over-stock.'
    :'Festival season (Oct): gift packs, sweets, chocolates, dry fruits, ghee, oil and sugar sell well. After the festival, check leftover gift packs and sweets for expiry.';
  A.push({tone:'good',t:'This time of year',p:season});
  A.push({tone:'info',t:'A daily habit that makes this work',p:'At about 10 pm open the Night count tab and enter what is on the shelf. The Report tab then shows weekly demand, fast and slow items and what to order next week. Tap Stock received whenever goods arrive, so the sold numbers stay correct.'});
  return A;
}

function soldInterval(i,d1){
  var c1=H.snaps[d1]&&H.snaps[d1][i.id]; if(c1==null) return null;
  var ds=Object.keys(H.snaps).filter(function(d){return d<d1&&H.snaps[d]&&H.snaps[d][i.id]!=null}).sort();
  if(!ds.length) return null;
  var d0=ds[ds.length-1];
  var rc=H.recv.filter(function(r){return r.id===i.id&&r.d>d0&&r.d<=d1}).reduce(function(s,r){return s+num(r.pcs)},0);
  var raw=num(H.snaps[d0][i.id])+rc-num(c1);
  return {sold:Math.max(0,raw),d0:d0,raw:raw};
}

/* demand engine: sold = earlier count + received - later count */
function analyze(){
  var W=28, t=today(), dates=Object.keys(H.snaps).sort(), per={};
  var recvBy={}; H.recv.forEach(function(r){(recvBy[r.id]=recvBy[r.id]||[]).push(r)});
  var from=new Date(); from.setDate(from.getDate()-(W-1)); var fs=ymd(from);
  var l7=new Date(); l7.setDate(l7.getDate()-6); var l7s=ymd(l7);
  S.items.forEach(function(i){
    var cd=dates.filter(function(d){return H.snaps[d]&&H.snaps[d][i.id]!=null}), daySold={};
    for(var k=1;k<cd.length;k++){
      var d0=cd[k-1], d1=cd[k];
      var rc=(recvBy[i.id]||[]).filter(function(r){return r.d>d0&&r.d<=d1}).reduce(function(s,r){return s+num(r.pcs)},0);
      var sold=Math.max(0,num(H.snaps[d0][i.id])+rc-num(H.snaps[d1][i.id]));
      var n=Math.round((parse(d1)-parse(d0))/864e5); if(n<1) continue;
      for(var j=0;j<n;j++){var dd=new Date(parse(d0));dd.setDate(dd.getDate()+1+j);daySold[ymd(dd)]=sold/n;}
    }
    var covered=0,total=0,last7=0;
    Object.keys(daySold).forEach(function(d){if(d>=fs&&d<=t){covered++;total+=daySold[d];if(d>=l7s)last7+=daySold[d];}});
    per[i.id]={daySold:daySold,covered:covered,total:total,last7:last7,weekly:covered>=3?total/covered*7:null,lasts:null};
  });
  return per;
}
function tagAll(per){
  var vals=S.items.map(function(i){return per[i.id].weekly}).filter(function(v){return v!=null&&v>0}).sort(function(a,b){return a-b});
  var q=function(p){return vals.length?vals[Math.min(vals.length-1,Math.floor(p*vals.length))]:0};
  var q25=q(0.25), q75=q(0.75), res={};
  S.items.forEach(function(i){
    var a=per[i.id], w=a.weekly, tg;
    if(w==null) tg='learning';
    else if(w===0) tg='none';
    else {
      a.lasts=num(i.qty)/(w/7);
      if(vals.length>=4&&w>=q75) tg='fast';
      else if((vals.length>=4&&w<=q25)||a.lasts>28) tg='slow';
      else tg='normal';
    }
    res[i.id]=tg;
  });
  return res;
}
var TAGN={fast:['Fast mover','ok'],slow:['Low demand','low'],none:['No sales','low'],normal:['Normal','info'],learning:['Learning','info']};
function nextWeekOrder(i,a){
  if(a.weekly==null) return null;
  var need=Math.max(0,Math.ceil(a.weekly*1.2)-num(i.qty)-(i.orderedOn?num(i.ordQty):0));
  var p=pk(i); if(p) need=Math.ceil(need/p)*p;
  return need;
}
var dName=function(i){var d=dealerOf(i.dealer);return d?d.name:'No wholesaler'};
function weekText(){
  var per=analyze(), list=S.items.map(function(i){return {i:i,nw:nextWeekOrder(i,per[i.id])}}).filter(function(x){return x.nw>0});
  list.sort(function(a,b){return dName(a.i).localeCompare(dName(b.i))||a.i.name.localeCompare(b.i.name,undefined,{numeric:true})});
  var t='Next week order plan - '+S.shop+' ('+longD(today())+')\n';
  var last=null;
  list.forEach(function(x){if(dName(x.i)!==last){last=dName(x.i);t+='\n'+last+'\n';}t+='- '+x.i.name+': '+ordTxt(x.i,x.nw)+'\n';});
  return list.length?t:'Nothing needs ordering for next week.';
}

  var rows=S.items.map(function(i){return {i:i,a:per[i.id],tag:tags[i.id]}});
  var wk=function(r){return r.a.weekly==null?'-':q2(r.a.weekly)+' '+esc(r.i.unit||'pcs')+' a week'+packEq(r.i,r.a.weekly)};
  var fast=rows.filter(function(r){return r.tag==='fast'}).sort(function(a,b){return b.a.weekly-a.a.weekly});
  var slow=rows.filter(function(r){return r.tag==='slow'||r.tag==='none'}).sort(function(a,b){return (a.a.weekly||0)-(b.a.weekly||0)});

  h+='<div class="grid2"><section class="card" style="margin:0"><h2>Fast movers</h2><p class="meta">Keep these stocked. Do not let them reach zero.</p><ul>'+(fast.length?fast.slice(0,8).map(li).join(''):'<li class="meta">Not enough data yet.</li>')+'</ul></section>'+
    '<section class="card" style="margin:0"><h2>Low demand</h2><p class="meta">Order less of these, or skip a week. Order only if they run low.</p><ul>'+(slow.length?slow.slice(0,8).map(function(r){return '<li><b>'+esc(r.i.name)+'</b>: '+(r.tag==='none'?'no sales':wk(r))+(r.a.lasts!=null?'. Stock lasts about '+Math.round(r.a.lasts)+' days.':'')+'</li>'}).join(''):'<li class="meta">Not enough data yet.</li>')+'</ul></section></div>';
  var plan=rows.map(function(r){return {i:r.i,nw:nextWeekOrder(r.i,r.a)}}).filter(function(x){return x.nw>0});
  plan.sort(function(a,b){return dName(a.i).localeCompare(dName(b.i))||a.i.name.localeCompare(b.i.name,undefined,{numeric:true})});
  h+='<h2 class="sec">What to order next week</h2><section class="card">';
  if(plan.length){
    h+='<p class="meta">Based on your average weekly sales plus 20% extra, minus what you have in stock. Rounded up to full packs.</p><div class="tablewrap"><table><thead><tr><th>Item</th><th class="n">Order</th><th>Buy from</th></tr></thead><tbody>';
    plan.forEach(function(x){h+='<tr><td><b>'+esc(x.i.name)+'</b></td><td class="n">'+esc(ordTxt(x.i,x.nw))+'</td><td>'+esc(dName(x.i))+'</td></tr>'});
    h+='</tbody></table></div><div class="actions"><button class="btn primary" type="button" data-act="copy-week">Copy this list</button></div>';

  var list=rows.filter(function(r){return rFilter==='all'||(rFilter==='slow'?r.tag==='slow':r.tag===rFilter)});
  list.sort(function(a,b){return (b.a.weekly==null?-1:b.a.weekly)-(a.a.weekly==null?-1:a.a.weekly)});

    h+='<div class="tablewrap"><table><thead><tr><th>Item</th><th class="n">Last 7 days</th><th class="n">Per week</th><th class="n">Stock lasts</th><th class="n">Order next week</th></tr></thead><tbody>';
    list.forEach(function(r){
      var i=r.i,a=r.a,u=esc(i.unit||'pcs'),nw=nextWeekOrder(i,a),tg=TAGN[r.tag];

/* Calculator */
function evalExpr(str){
  var s=str.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,''), p=0;
  function fac(){
    var neg=false; if(s[p]==='-'){neg=true;p++;} else if(s[p]==='+') p++;
    var v;
    if(s[p]==='('){p++;v=ex();if(s[p]!==')') throw 1;p++;}
    else {var m=/^\d*\.?\d+/.exec(s.slice(p)); if(!m) throw 1; v=parseFloat(m[0]); p+=m[0].length;}
    while(s[p]==='%'){v=v/100;p++;}
    return neg?-v:v;
  }
  function term(){var v=fac();while(s[p]==='*'||s[p]==='/'){var o=s[p++],r=fac();if(o==='/'&&r===0) throw 1;v=o==='*'?v*r:v/r;}return v;}
  function ex(){var v=term();while(s[p]==='+'||s[p]==='-'){var o=s[p++],r=term();v=o==='+'?v+r:v-r;}return v;}
  var out=ex(); if(p<s.length) throw 1; return out;
}

  var pr=s-b, h='<div>Profit on 1 piece: <b>'+(pr<0?'Loss of '+money(-pr):money(pr))+'</b></div><div>Margin on sale: <b>'+pct(pr/s*100)+'</b>. Markup on cost: <b>'+pct(pr/b*100)+'</b>.</div>';
  if(q>0) h+='<div>On '+q2(q)+' pieces: sales '+money(s*q)+', '+(pr<0?'loss':'profit')+' <b>'+money(Math.abs(pr*q))+'</b>.</div>';
  o.innerHTML=h;
}
function renderCalc(){
  var keys=['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','%','+','(',')','⌫','C'];
  var kh=keys.map(function(k){return '<button type="button" class="key'+(/[0-9.]/.test(k)?'':' op')+'" data-act="ckey" data-k="'+k+'" aria-label="'+({'÷':'divide','×':'multiply','−':'minus','⌫':'backspace','C':'clear'}[k]||k)+'">'+k+'</button>'}).join('');

    '<div style="display:grid;gap:14px;align-content:start">'+

      '<div class="fld"><label for="k_pp">Pack price (₹)</label><input id="k_pp" type="number" inputmode="decimal" step="any" min="0"></div>'+
      '<div class="fld"><label for="k_pn">Pieces in the pack</label><input id="k_pn" type="number" inputmode="decimal" step="any" min="0"><div class="actions" style="margin-top:6px"><button class="btn small" type="button" data-act="packn" data-v="12">Dozen 12</button><button class="btn small" type="button" data-act="packn" data-v="24">24</button></div></div>'+
      '<div class="fld"><label for="k_pm">Margin you want (%)</label><input id="k_pm" type="number" inputmode="decimal" step="any" min="0"></div>'+
      '<div class="fld"><label for="k_pr">MRP of 1 piece (optional)</label><input id="k_pr" type="number" inputmode="decimal" step="any" min="0"></div></div>'+
      '<div class="res" id="k_pout">Enter the pack price and the pieces in the pack.</div></section>'+
    '<section class="card" style="margin:0"><h2>Margin and profit</h2><div class="fgrid" style="margin-top:10px">'+
      '<div class="fld"><label for="k_mb">Buy rate (₹)</label><input id="k_mb" type="number" inputmode="decimal" step="any" min="0"></div>'+
      '<div class="fld"><label for="k_ms">Sell rate (₹)</label><input id="k_ms" type="number" inputmode="decimal" step="any" min="0"></div>'+
      '<div class="fld"><label for="k_mq">Pieces (optional)</label><input id="k_mq" type="number" inputmode="decimal" step="any" min="0"></div></div>'+
      '<div class="res" id="k_mout">Enter the buy rate and the sell rate of one piece.</div></section></div></div>';
}

/* ---------- unit converter ---------- */
var UC={Weight:{g:1,kg:1000,quintal:100000,tonne:1000000},Volume:{ml:1,litre:1000},Count:{pcs:1,pair:2,dozen:12,gross:144}};
function vSel(){var e=$('#v_item');return e?S.items.find(function(x){return x.id===e.value}):null}
function renderUnits(){
  var items=S.items.slice().sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});
  var one=items.length?
    '<div class="fld" style="margin-top:10px"><label for="v_item">Item</label><select id="v_item">'+items.map(function(i){return '<option value="'+i.id+'">'+esc(i.name)+'</option>'}).join('')+'</select></div>'+
    '<div id="v_w" style="margin-top:10px"></div><div class="res" id="v_out"></div>'+
    '<div class="fld" style="margin-top:14px"><label for="v_pcs">Or type the total pieces to see packs</label><input id="v_pcs" type="number" inputmode="decimal" step="any" min="0"></div><div class="res" id="v_pout"></div>'
    :'<div class="empty" style="margin-top:10px"><b>No items yet</b>Add items in the Stock tab first.</div>';
  $('#view').innerHTML='<div class="grid2"><section class="card" style="margin:0"><h2>Packs and loose pieces</h2><p class="meta">Pick an item, then type its packs and loose pieces. Pack sizes come from the item’s Edit form.</p>'+one+'</section>'+
    '<section class="card" style="margin:0"><h2>Weight, volume and count</h2><p class="meta">Kg to grams, litre to ml, dozen to pieces.</p>'+
    '<div class="fgrid" style="margin-top:10px"><div class="fld"><label for="v_gv">Value</label><input id="v_gv" type="number" inputmode="decimal" step="any" min="0"></div>'+
    '<div class="fld"><label for="v_gc">Type</label><select id="v_gc">'+Object.keys(UC).map(function(k){return '<option>'+k+'</option>'}).join('')+'</select></div>'+
    '<div class="fld"><label for="v_gf">From</label><select id="v_gf"></select></div><div class="fld"><label for="v_gt">To</label><select id="v_gt"></select></div></div>'+
    '<div class="res" id="v_gout"></div></section></div>';
  vGenFill(); vGen(); if(items.length) vItem();
}
function vItem(){var i=vSel(); if(!i) return; $('#v_w').innerHTML=qwHTML(i,0,'class="vqa"','class="vqu"','class="vqb"','Quantity'); vCalc(); vPcs();}
function vCalc(){
  var i=vSel(), w=$('#v_w'); if(!i||!w) return;
  var list=unitsFrom(i), base=i.unit||'pcs', a=w.querySelector('.vqa').value, u=w.querySelector('.vqu').value, b=w.querySelector('.vqb').value;
  var pcs=joinQty(list,a,u,b), o=$('#v_out');
  if(pcs<=0){o.textContent='Type packs or loose pieces above.';return;}
  var h='<div>Total: <b>'+q2(pcs)+' '+esc(base)+'</b>'+(mixText(list,base,a,u,b)?' ('+esc(mixText(list,base,a,u,b))+')':'')+'</div>';
  list.forEach(function(x){h+='<div>= '+q2(pcs/x.size)+' '+esc(x.name)+'</div>'});
  if(num(i.buy)>0) h+='<div>Cost at buy rate: '+money(pcs*num(i.buy))+'</div>';
  if(num(i.sell)>0) h+='<div>Value at sell rate: '+money(pcs*num(i.sell))+'</div>';
  o.innerHTML=h;
}
function vPcs(){
  var i=vSel(), o=$('#v_pout'), p=$('#v_pcs'); if(!i||!o) return;
  var pcs=num(p.value), base=i.unit||'pcs';
  if(pcs<=0){o.textContent='Type the total pieces above.';return;}
  var h='';
  unitsFrom(i).forEach(function(x){
    var f=Math.floor(pcs/x.size+1e-9), r=Math.round((pcs-f*x.size)*100)/100;
    h+='<div>'+f+' '+esc(x.name)+(r?' + '+q2(r)+' '+esc(base):'')+'</div>';
  });
  o.innerHTML=h||'';
}
function vGenFill(){
  var c=$('#v_gc').value, k=Object.keys(UC[c]), opt=k.map(function(x){return '<option>'+x+'</option>'}).join('');
  $('#v_gf').innerHTML=opt; $('#v_gt').innerHTML=opt; $('#v_gt').value=k[1]||k[0];
}
function vGen(){
  var c=$('#v_gc').value, F=UC[c], v=num($('#v_gv').value), f=$('#v_gf').value, t=$('#v_gt').value, o=$('#v_gout');
  if($('#v_gv').value===''){o.textContent='Type a value above.';return;}
  var base=v*F[f], h='<div><b>'+q2(v)+' '+f+' = '+(Math.round(base/F[t]*1e6)/1e6)+' '+t+'</b></div>';
  Object.keys(F).forEach(function(k){if(k!==t&&k!==f) h+='<div>= '+(Math.round(base/F[k]*1e6)/1e6)+' '+k+'</div>'});
  o.innerHTML=h;
}
function unitsEvent(t){
  if(tab!=='units'||!t) return;
  var id=t.id||'', cl=String(t.className||'');
  if(id==='v_item') vItem();
  else if(/(^|\s)vq[aub](\s|$)/.test(cl)) vCalc();
  else if(id==='v_pcs') vPcs();
  else if(id==='v_gc'){vGenFill();vGen();}
  else if(id==='v_gv'||id==='v_gf'||id==='v_gt') vGen();
}
['input','change'].forEach(function(ev){document.addEventListener(ev,function(e){unitsEvent(e.target)})});

/* ---------- actions ---------- */
function renderView(){
  var f={stock:function(){renderStock(false)},tobacco:function(){renderStock(true)},night:renderNight,orders:renderOrders,dealers:renderDealers,calendar:renderCalendar,report:renderReport,month:renderMonth,calc:renderCalc,units:renderUnits,ideas:renderIdeas}[tab];
  f();
}
function render(){renderHero();renderTabs();renderView();}
function goTab(t){
  tab=t; renderTabs(); renderView();
  var hh=$('#hero').offsetHeight; if(window.scrollY>hh) window.scrollTo(0,hh);
}

document.addEventListener('click',function(e){
  if(e.target.id==='ov'){closeOv();return;}
  var b=e.target.closest('[data-act],[data-tab]'); if(!b) return;
  if(b.dataset.tab){goTab(b.dataset.tab);return;}
  var a=b.dataset.act,id=b.dataset.id;
  var it=id?S.items.find(function(x){return x.id===id}):null;
  switch(a){
    case 'go-orders': goTab('orders'); break;
    case 'close': closeOv(); break;
    case 'chip': fCat=b.dataset.cat; renderStock(curTob); break;
    case 'need': fNeed=!fNeed; renderStock(curTob); break;
    case 'inc': if(it) setQty(id,num(it.qty)+1); break;
    case 'dec': if(it) setQty(id,num(it.qty)-1); break;
    case 'edit': if(it) openOv(itemForm(it,false)); break;
    case 'add-item':
      openOv(itemForm({name:'',cat:'',unit:'pcs',buy:'',sell:'',qty:0,min:'',target:'',dealer:'',ovr:'',exp:'',note:''},true,curTob?'Tobacco':(fCat!=='All'?fCat:'')));
      break;
    case 'del-item':
      if(b.dataset.armed){
        S.items=S.items.filter(function(x){return x.id!==id}); touch(true); closeOv(); render(); toast('Item deleted');
      } else {b.dataset.armed='1'; b.textContent='Tap again to delete';}
      break;
    case 'add-dealer': openOv(dealerForm({name:'',phone:'',products:'',days:[],lead:1,note:''},true)); break;
    case 'edit-dealer': var dd=dealerOf(id); if(dd) openOv(dealerForm(dd,false)); break;
    case 'del-dealer':
      if(b.dataset.armed){
        S.dealers=S.dealers.filter(function(x){return x.id!==id});
        S.items.forEach(function(x){if(x.dealer===id)x.dealer=''});
        touch(); closeOv(); render(); toast('Wholesaler deleted. Its items now have no wholesaler.');
      } else {b.dataset.armed='1'; b.textContent='Tap again to delete';}
      break;
    case 'copy-order': copyText(orderText(b.dataset.g),'Order message copied. Paste it into WhatsApp.'); break;
    case 'mark-ordered':
      var g=groups().find(function(x){return x.id===b.dataset.g});
      if(g){g.lines.forEach(function(i){i.ordQty=orderQty(i);i.orderedOn=today();i.ovr='';}); touch(); render(); toast('Marked as ordered');}
      break;
    case 'receive':
    case 'received':
      if(it) openReceive(id);
      break;
    case 'undo-order': if(it){it.orderedOn='';it.ordQty=0;touch();render();} break;
    case 'dismiss-sample': S.sample=false; touch(); renderStock(curTob); break;
    case 'cal-prev': calM--; if(calM<0){calM=11;calY--} renderCalendar(); break;
    case 'cal-next': calM++; if(calM>11){calM=0;calY++} renderCalendar(); break;
    case 'pick-day':
      selDate=b.dataset.date; var p=parse(selDate); calY=p.getFullYear(); calM=p.getMonth(); renderCalendar();
      var sc=$('#remind'); if(sc&&b.classList.contains('wd')) sc.closest('.card').scrollIntoView({block:'nearest'});
      break;
    case 'copy-tsv':
      var rows=[['Item','Category','Unit','Buy rate','Sell rate','In stock','Reorder at','Fill up to','Order qty','Wholesaler']];
      S.items.forEach(function(i){var d=dealerOf(i.dealer);rows.push([i.name,i.cat,i.unit,i.buy,i.sell,i.qty,i.min,i.target,orderQty(i),d?d.name:''])});
      copyText(rows.map(function(r){return r.join('\t')}).join('\n'),'Copied. Paste it into Excel or Google Sheets.');
      break;
    case 'mprev': rMonth=mShift(rMonth,-1); renderMonth(); break;
    case 'mnext': rMonth=mShift(rMonth,1); renderMonth(); break;
    case 'dl-docx': downloadDocx(); break;
    case 'ckey':
      var ce=$('#k_expr'), kk=b.dataset.k;
      if(kk==='C') ce.value=''; else if(kk==='\u232B') ce.value=ce.value.slice(0,-1); else ce.value+=kk;
      calcShow(); break;
    case 'ceq':
      var ce2=$('#k_expr'); try{var rv=Math.round(evalExpr(ce2.value)*1e6)/1e6; ce2.value=String(rv); calcShow();}catch(e){calcShow();} break;
    case 'packn': $('#k_pn').value=b.dataset.v; calcPack(); break;
    case 'backup': downloadBackup(); break;
    case 'restore-pick': var rf=$('#restoreFile'); if(rf) rf.click(); else { goTab('ideas'); toast('Tap Restore backup here.'); } break;
    case 'do-restore':
      if(pendingRestore){S=pendingRestore.S;H=pendingRestore.H||{snaps:{}};pendingRestore=null;normalize();S.lastBackup=today();touch(true);closeOv();$('#shopName').value=S.shop;render();toast('Backup restored');}
      break;
    case 'copy-week': copyText(weekText(),'Next week list copied.'); break;
    case 'rfilter': rFilter=b.dataset.f; renderReport(); break;
    case 'ncfilter': fNC=!fNC; renderNight(); break;
    case 'clear-all':
      if(b.dataset.armed){S.items=[];S.sample=false;touch(true);render();toast('All items removed');}
      else {b.dataset.armed='1'; b.textContent='Tap again to remove every item';}
      break;
  }
});

document.addEventListener('change',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('qty')){
    var v=parseFloat(t.value); if(!isFinite(v)||v<0) v=0; setQty(t.dataset.id,v);
  } else if(t.classList&&(t.classList.contains('nca')||t.classList.contains('ncb')||t.classList.contains('ncu'))){
    ncChange(t,true);
  } else if(t.classList&&t.classList.contains('expin')){
    if(!S.exp[rMonth]) S.exp[rMonth]={}; S.exp[rMonth][t.dataset.k]=t.value===''?'':num(t.value);
    touch(); renderMonth();
  } else if(t.id==='f_dealer'){
    var fm=t.form, sd0=dealerOf(t.value)||{};
    fm.elements['s_name'].value=sd0.name||''; fm.elements['s_phone'].value=sd0.phone||''; fm.elements['s_addr'].value=sd0.address||'';
    if(t.value==='__new__') fm.elements['s_name'].focus();
  } else if(t.id==='shopName'){
    S.shop=t.value.trim()||'My Shop'; touch();
  } else if(t.id==='remind'){
    var val=t.value.trim(); if(val) S.remind[selDate]=val; else delete S.remind[selDate];
    touch(); renderCalendar();
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='search'){qStr=t.value;renderList();}
  else if(t.id==='notes'){S.notes=t.value;touch();}
  else if(t.id==='nsearch'){qNight=t.value;renderNList();}
  else if(t.id==='k_expr') calcShow();
  else if(/^k_p[a-z]$/.test(t.id||'')&&t.id!=='k_pout') calcPack();
  else if(/^k_m[a-z]$/.test(t.id||'')&&t.id!=='k_mout') calcMargin();
  else if(t.classList&&(t.classList.contains('nca')||t.classList.contains('ncb'))){ncChange(t,false);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#ov').hidden) closeOv();
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('qty')) e.target.blur();
  if(e.key==='Enter'&&e.target.id==='k_expr'){e.preventDefault();var b0=document.querySelector('[data-act="ceq"]');if(b0)b0.click();}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target, id=f.dataset.id, err=$('#ferr');
  var g=function(n){return f.elements[n]?f.elements[n].value.trim():''};
  if(f.id==='itemForm'){
    var name=g('f_name');
    if(!name){err.textContent='Enter the item name.';f.elements['f_name'].focus();return;}
    var dsel=g('f_dealer'), sn=g('s_name'), did='';
    if(dsel==='__new__'&&!sn){err.textContent='Enter the supplier name, or choose No wholesaler chosen.';f.elements['s_name'].focus();return;}
    if(dsel&&dsel!=='__new__'){var dx=dealerOf(dsel);if(dx){if(sn)dx.name=sn;dx.phone=g('s_phone');dx.address=g('s_addr');did=dx.id;}}
    else if(sn){var nd={id:uid(),name:sn,phone:g('s_phone'),address:g('s_addr'),products:'',days:[],lead:1,note:''};S.dealers.push(nd);did=nd.id;}
    var data={name:name,cat:g('f_cat')||'Other',unit:g('f_unit')||'pcs',buy:num(g('f_buy')),sell:num(g('f_sell')),qty:pcsOf(f,'qty'),min:pcsOf(f,'min'),target:pcsOf(f,'target'),dealer:did,ovr:(f.elements['qa_ovr'].value===''&&f.elements['qb_ovr'].value==='')?'':pcsOf(f,'ovr'),exp:g('f_exp'),note:g('f_note'),packName:g('f_packname'),packSize:g('f_packsize')===''?'':num(g('f_packsize')),boxName:g('f_boxname'),boxSize:g('f_boxsize')===''?'':num(g('f_boxsize')),ordUnit:g('f_ordunit')};
    var it=id?S.items.find(function(x){return x.id===id}):null;
    if(it){Object.assign(it,data);} else {it=Object.assign({id:uid(),orderedOn:'',ordQty:0},data);S.items.push(it);}
    snap(it); touch(true); closeOv();
    if(isTob(it)&&tab==='stock') tab='tobacco'; else if(!isTob(it)&&tab==='tobacco') tab='stock';
    render(); toast('Item saved');
  } else if(f.id==='recvForm'){
    var rit=S.items.find(function(x){return x.id===id}); if(!rit){closeOv();return;}
    var rlist=unitsFrom(rit), rbase=rit.unit||'pcs', ra=g('ra'), rb=g('rb'), ru=g('ru');
    var rpcs=joinQty(rlist,ra,ru,rb);
    if(!(rpcs>0)){err.textContent='Enter how much came.';f.elements['ra'].focus();return;}
    H.recv.push({d:today(),id:rit.id,qty:rpcs,u:rbase,pcs:rpcs,t:mixText(rlist,rbase,ra,ru,rb)||(q2(rpcs)+' '+rbase)});
    rit.qty=Math.round((num(rit.qty)+rpcs)*100)/100; rit.orderedOn=''; rit.ordQty=0;
    snap(rit); touch(true); closeOv(); render(); toast('Added '+q2(rpcs)+' '+rbase+' to stock');
  } else if(f.id==='dealerForm'){
    var dn=g('d_name');
    if(!dn){err.textContent='Enter the wholesaler name.';f.elements['d_name'].focus();return;}
    var days=Array.prototype.map.call(f.querySelectorAll('input[name=day]:checked'),function(c){return parseInt(c.value,10)});
    var dd={name:dn,phone:g('d_phone'),address:g('d_address'),products:g('d_products'),days:days,lead:Math.max(0,Math.round(num(g('d_lead')))),note:g('d_note')};
    var ex=id?dealerOf(id):null;
    if(ex) Object.assign(ex,dd); else S.dealers.push(Object.assign({id:uid()},dd));
    touch(); closeOv(); render(); toast('Wholesaler saved');
  }
});

['input','change'].forEach(function(ev){
  document.addEventListener(ev,function(e){var f=e.target.form;if(f&&f.id==='itemForm'){ if(e.type==='change'&&e.target.id&&e.target.id.indexOf('qu_')===0) e.target.dataset.touched='1'; syncQty(f);} else if(f&&f.id==='recvForm') syncRecv(f);});
});

/* ---------- start ---------- */
async function boot(){
  var loaded=false;
  try{
    var raw=localStorage.getItem(LS);
    if(raw){var o=JSON.parse(raw); if(o&&o.S&&Array.isArray(o.S.items)){S=o.S;H=o.H||{snaps:{}};loaded=true;}}
  }catch(e){}
  if(!S) S=starter();
  normalize();
  if(upgrade()) normalize();
  $('#shopName').value=S.shop;
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  setSave('start');
  render();
  var db=null;
  try{ if(window.claude&&window.claude.use) db=await window.claude.use('db'); }catch(e){db=null}
  try{ if(window.claude&&window.claude.use) DL=await window.claude.use('downloads'); }catch(e){DL=null}
  if(!db){setSave('local');return;}
  mainRef=db.doc('shop/main'); histRef=db.doc('shop/hist');
  var got=false;
  var slow=setTimeout(function(){if(!got) setSave('slow')},10000);
  mainRef.onSnapshot(function(snap){
    if(snap.metadata&&snap.metadata.hasPendingWrites) return;
    got=true; clearTimeout(slow);
    if(snap.exists){
      if(!dirty&&!saving){
        S=JSON.parse(JSON.stringify(snap.data())); normalize(); if(upgrade()){normalize();touch(true);}
        $('#shopName').value=S.shop; cache(); renderHero(); renderTabs(); if($('#ov').hidden) renderViewSafe();
      }
      setSave(dirty?'pending':'db');
    } else {
      if(loaded&&!S.sample){dirty=true;hdirty=true;flush();} else setSave('db');
    }
  },function(){setSave('error')});
  histRef.onSnapshot(function(snap){
    if(snap.metadata&&snap.metadata.hasPendingWrites) return;
    if(snap.exists&&!hdirty&&!saving){H=JSON.parse(JSON.stringify(snap.data()));if(!H.snaps)H.snaps={};if(!Array.isArray(H.recv))H.recv=[];if(!H.months)H.months={};}
  },function(){});
}
function renderViewSafe(){
  var a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.id!=='search') return;
  renderView();
}
boot();
})();
